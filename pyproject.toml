[project]
name = "datadog-mcp"
version = "0.0.7"
description = "Datadog MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datadog-api-client>=2.59.0",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.scripts]
datadog-mcp = "datadog_mcp.server:cli_main"
